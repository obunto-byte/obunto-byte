<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">XEBAC HAT cyberpunk terminal</title><desc id="desc">Tokyo Night terminal. The whoami command types itself out, then reveals XEBAC HAT. Reduced-motion users see the final text immediately.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1020"/><stop offset="1" stop-color="#1a1b26"/></linearGradient><linearGradient id="edge" x2="1"><stop stop-color="#7dcfff"/><stop offset=".55" stop-color="#bb9af7"/><stop offset="1" stop-color="#f7768e"/></linearGradient><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#fff" stroke-opacity=".035"/></pattern><pattern id="mesh" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7aa2f7" stroke-opacity=".07"/></pattern></defs>
<rect x="2" y="2" width="1196" height="306" rx="22" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/><rect x="3" y="3" width="1194" height="304" rx="21" fill="url(#mesh)"/><rect x="3" y="3" width="1194" height="304" rx="21" fill="url(#scan)"/><path d="M3 58H1197" stroke="#7dcfff" stroke-opacity=".35"/>
<circle cx="34" cy="31" r="7" fill="#f7768e"/><circle cx="58" cy="31" r="7" fill="#e0af68"/><circle cx="82" cy="31" r="7" fill="#9ece6a"/><text x="112" y="36" fill="#7982a9" font-family="monospace" font-size="14">xebac-hat@security-lab:~</text><text x="1158" y="36" text-anchor="end" fill="#7dcfff" font-family="monospace" font-size="12">SESSION: AUTHORIZED</text>
<g class="motion-copy" font-family="'Fira Code','Courier New',monospace"><text x="78" y="132" fill="#7dcfff" font-size="23">$</text><g clip-path="url(#promptClip)"><text x="108" y="132" fill="#c0caf5" font-size="23">whoami</text></g><text x="78" y="196" fill="#f7768e" font-size="15">IDENTITY //</text><g clip-path="url(#nameClip)"><text x="78" y="240" fill="#7dcfff" font-size="37" font-weight="700" letter-spacing="5">XEBAC HAT</text></g><rect x="358" y="210" width="3" height="36" fill="#7dcfff"><animate attributeName="opacity" values="1;0;1" dur="1s" begin="2.4s" repeatCount="indefinite"/></rect><text x="78" y="278" fill="#7982a9" font-size="13">RED TEAM METHODOLOGY / SECURITY RESEARCH / DEFENSIVE ENGINEERING</text></g>
<clipPath id="promptClip"><rect x="108" y="102" width="0" height="38"><animate attributeName="width" from="0" to="100" dur="1.05s" fill="freeze"/></rect></clipPath><clipPath id="nameClip"><rect x="78" y="208" width="0" height="44"><animate attributeName="width" from="0" to="340" begin="1.35s" dur="1.05s" fill="freeze"/></rect></clipPath>
<g class="static-copy" font-family="'Fira Code','Courier New',monospace"><text x="78" y="132" fill="#7dcfff" font-size="23">$</text><text x="108" y="132" fill="#c0caf5" font-size="23">whoami</text><text x="78" y="196" fill="#f7768e" font-size="15">IDENTITY //</text><text x="78" y="240" fill="#7dcfff" font-size="37" font-weight="700" letter-spacing="5">XEBAC HAT</text><text x="78" y="278" fill="#7982a9" font-size="13">RED TEAM METHODOLOGY / SECURITY RESEARCH / DEFENSIVE ENGINEERING</text></g>
<style>.static-copy{display:none}@media(prefers-reduced-motion:reduce){.motion-copy{display:none}.static-copy{display:inline}}</style></svg>