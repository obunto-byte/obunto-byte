<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="206" viewBox="0 0 960 206" role="img" aria-labelledby="title desc">
  <title id="title">XEBAC HAT — Research Intelligence</title>
  <desc id="desc">Four connected research domains shown as cyberpunk interface cards: AI and agent security, offensive security, security engineering, and cloud governance.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D1A"/>
      <stop offset=".52" stop-color="#0B0B1B"/>
      <stop offset="1" stop-color="#12091B"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset=".48" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FF35C8"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D2432"/>
      <stop offset="1" stop-color="#0B1323"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17132D"/>
      <stop offset="1" stop-color="#101225"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#251128"/>
      <stop offset="1" stop-color="#111222"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#6686B5" stroke-opacity=".09" stroke-width=".7"/>
      <circle cx="0" cy="0" r=".8" fill="#00E5FF" fill-opacity=".2"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x=".75" y=".75" width="958.5" height="204.5" rx="11"
        fill="url(#bg)" stroke="url(#neon)" stroke-width="1.2"/>
  <rect x="2" y="2" width="956" height="202" rx="10" fill="url(#grid)"/>

  <!-- Transmission rails -->
  <g fill="none" stroke="url(#neon)" stroke-width="1.2" opacity=".78">
    <path d="M0 13H960"/>
    <path d="M0 18H960" opacity=".35"/>
    <path d="M0 188H960" opacity=".5"/>
    <path d="M0 194H960"/>
  </g>
  <g fill="none" stroke="#00E5FF" stroke-width="1.5" filter="url(#softGlow)">
    <path d="M0 31H18L28 39H50"/>
    <path d="M0 45H16"/>
  </g>
  <g fill="none" stroke="#FF35C8" stroke-width="1.5" filter="url(#softGlow)">
    <path d="M960 31H942L932 39H910"/>
    <path d="M960 45H944"/>
  </g>

  <!-- Header -->
  <g font-family="monospace">
    <text x="24" y="29" font-size="10.5" font-weight="700"
          fill="#00E5FF" letter-spacing="2">
      XEBAC HAT / RESEARCH INTELLIGENCE
    </text>
    <text x="936" y="29" font-size="8.5" font-weight="700"
          fill="#C5D0E0" text-anchor="end" letter-spacing=".7">
      FOUR CONNECTED DOMAINS / ACTIVE
    </text>
    <path d="M24 36H936" stroke="url(#neon)" stroke-opacity=".65"/>
  </g>

  <!-- Inter-card data links -->
  <g fill="none" stroke="url(#neon)" stroke-width="1.2" opacity=".72">
    <path d="M240 112H256"/>
    <path d="M472 112H488"/>
    <path d="M704 112H720"/>
  </g>
  <g fill="#00E5FF" filter="url(#glow)">
    <circle cx="248" cy="112" r="1.6"/>
    <circle cx="480" cy="112" r="1.6" fill="#A78BFA"/>
    <circle cx="712" cy="112" r="1.6" fill="#FF35C8"/>
  </g>

  <!-- Domain 01 -->
  <g transform="translate(24 47)" font-family="monospace">
    <rect width="216" height="131" rx="7" fill="url(#cyan)"
          stroke="#00D9FF" stroke-opacity=".82"/>
    <path d="M1 8V1H8M208 1H215V8M1 123V130H8M208 130H215V123"
          fill="none" stroke="#00E5FF" stroke-width="1.15"/>
    <path d="M12 40H204" stroke="#00D9FF" stroke-opacity=".48"/>
    <circle cx="190" cy="20" r="4.6" fill="#00E5FF" filter="url(#glow)">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3.5;5;3.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="13" y="25" fill="#00E5FF" font-size="11">01 /</text>
    <text x="13" y="67" fill="#F1F8FF" font-size="11.4" font-weight="bold">AI &amp; AGENT SECURITY</text>
    <text x="13" y="90" fill="#A9C2D5" font-size="9.2">LLM evaluation / threat modelling</text>
    <path d="M13 111H203" stroke="#304A60"/>
    <rect x="13" y="109" width="48" height="3.5" fill="#00E5FF" filter="url(#softGlow)">
      <animate attributeName="width" values="48;155;48" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="203" y="124" text-anchor="end" fill="#6D9BB3" font-size="7">NODE / 01</text>
  </g>

  <!-- Domain 02 -->
  <g transform="translate(256 47)" font-family="monospace">
    <rect width="216" height="131" rx="7" fill="url(#cyan)"
          stroke="#557EFF" stroke-opacity=".88"/>
    <path d="M1 8V1H8M208 1H215V8M1 123V130H8M208 130H215V123"
          fill="none" stroke="#718CFF" stroke-width="1.15"/>
    <path d="M12 40H204" stroke="#718CFF" stroke-opacity=".48"/>
    <circle cx="190" cy="20" r="4.6" fill="#718CFF" filter="url(#glow)">
      <animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3.5;5;3.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <text x="13" y="25" fill="#8FA8FF" font-size="11">02 /</text>
    <text x="13" y="67" fill="#F1F8FF" font-size="11.4" font-weight="bold">OFFENSIVE SECURITY</text>
    <text x="13" y="90" fill="#B1BDD9" font-size="9.2">Web / API / network / AD</text>
    <path d="M13 111H203" stroke="#3A4269"/>
    <rect x="13" y="109" width="48" height="3.5" fill="#718CFF" filter="url(#softGlow)">
      <animate attributeName="width" values="48;155;48" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="203" y="124" text-anchor="end" fill="#858FC1" font-size="7">NODE / 02</text>
  </g>

  <!-- Domain 03 -->
  <g transform="translate(488 47)" font-family="monospace">
    <rect width="216" height="131" rx="7" fill="url(#violet)"
          stroke="#A855F7" stroke-opacity=".86"/>
    <path d="M1 8V1H8M208 1H215V8M1 123V130H8M208 130H215V123"
          fill="none" stroke="#A855F7" stroke-width="1.15"/>
    <path d="M12 40H204" stroke="#A855F7" stroke-opacity=".48"/>
    <circle cx="190" cy="20" r="4.6" fill="#C084FC" filter="url(#glow)">
      <animate attributeName="opacity" values=".2;1;.2" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3.5;5;3.5" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <text x="13" y="25" fill="#C084FC" font-size="11">03 /</text>
    <text x="13" y="67" fill="#F5F0FF" font-size="11.4" font-weight="bold">SECURITY ENGINEERING</text>
    <text x="13" y="90" fill="#BDB0D2" font-size="9.2">Automation / evidence / remediation</text>
    <path d="M13 111H203" stroke="#4A365F"/>
    <rect x="13" y="109" width="48" height="3.5" fill="#B45CFF" filter="url(#softGlow)">
      <animate attributeName="width" values="48;155;48" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="203" y="124" text-anchor="end" fill="#A58DBF" font-size="7">NODE / 03</text>
  </g>

  <!-- Domain 04 -->
  <g transform="translate(720 47)" font-family="monospace">
    <rect width="216" height="131" rx="7" fill="url(#magenta)"
          stroke="#FF35C8" stroke-opacity=".86"/>
    <path d="M1 8V1H8M208 1H215V8M1 123V130H8M208 130H215V123"
          fill="none" stroke="#FF35C8" stroke-width="1.15"/>
    <path d="M12 40H204" stroke="#FF35C8" stroke-opacity=".48"/>
    <circle cx="190" cy="20" r="4.6" fill="#FF62D7" filter="url(#glow)">
      <animate attributeName="opacity" values=".2;1;.2" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3.5;5;3.5" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <text x="13" y="25" fill="#FF70D7" font-size="11">04 /</text>
    <text x="13" y="67" fill="#FFF1FC" font-size="11.4" font-weight="bold">CLOUD &amp; GOVERNANCE</text>
    <text x="13" y="90" fill="#CDB2CB" font-size="9.2">IAM / cloud / ISO 27001</text>
    <path d="M13 111H203" stroke="#593451"/>
    <rect x="13" y="109" width="48" height="3.5" fill="#FF35C8" filter="url(#softGlow)">
      <animate attributeName="width" values="48;155;48" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="203" y="124" text-anchor="end" fill="#B67CA9" font-size="7">NODE / 04</text>
  </g>

  <!-- Footer / status -->
  <path d="M24 190H936" stroke="url(#neon)" stroke-opacity=".62"/>
  <g font-family="monospace" font-size="7.2">
    <text x="24" y="201" fill="#9DB5C8">XEBAC HAT // BUILD • ANALYZE • PROTECT</text>
    <text x="936" y="201" text-anchor="end" fill="#FF70D7">SYSTEM STATUS / ONLINE</text>
  </g>
</svg>