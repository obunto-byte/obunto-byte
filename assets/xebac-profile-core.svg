 <path d="M450 54H600L630 84M450 338H600L630 308M960 54H850L820 84M960 338H850L820 308" stroke-dasharray="4 8"/>
</g>
<g fill="#00F5FF"><circle cx="260" cy="90" r="3"/><circle cx="280" cy="300" r="3"/><circle cx="1040" cy="76" r="3"/><circle cx="1040" cy="322" r="3"/></g>
<g transform="translate(865 194)" fill="none" filter="url(#glow)">
