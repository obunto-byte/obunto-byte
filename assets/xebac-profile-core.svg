 <ellipse rx="132" ry="132" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="8 10"/>
 <ellipse rx="105" ry="105" stroke="#00F5FF" stroke-opacity=".6" stroke-width="1"/>
 <circle r="88" fill="url(#core)" stroke="#00F5FF" stroke-opacity=".85" stroke-width="2"/>
 <circle r="58" stroke="#FF3CAC" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="3 8"/>
 <path d="M-65 0H65M0 -65V65M-45 -45L45 45M45 -45L-45 45" stroke="#C8F9FF" stroke-opacity=".42"/>
 <circle r="18" fill="#E8FDFF" fill-opacity=".8"/>
 <circle r="7" fill="#00F5FF"/>
 <circle cx="158" cy="-38" r="7" fill="#00F5FF"/><circle cx="-140" cy="88" r="5" fill="#FF3CAC"/>
</g>
<g font-family="monospace">
 <text x="68" y="80" fill="#00F5FF" font-size="13" letter-spacing="4">XEBAC HAT // SECURITY LAB</text>
 <text x="68" y="155" fill="#F4F7FF" font-size="57" font-weight="700" letter-spacing="3">XEBAC HAT</text>
 <text x="70" y="193" fill="#B6C4E8" font-size="17" letter-spacing="2">DEFENSIVE SECURITY · PYTHON AUTOMATION</text>
 <text x="70" y="220" fill="#B6C4E8" font-size="17" letter-spacing="2">SYSTEMS RESEARCH · RESPONSIBLE TESTING</text>
