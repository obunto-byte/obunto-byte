<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">XEBAC HAT cyberpunk security core</title>
<desc id="desc">A futuristic neon security core with cyan and magenta orbital rings, circuit traces, and a dark cyberpunk terminal atmosphere.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B18"/><stop offset=".55" stop-color="#10132B"/><stop offset="1" stop-color="#250C2B"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00F5FF"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF3CAC"/></linearGradient>
  <radialGradient id="core"><stop stop-color="#DDFBFF" stop-opacity=".9"/><stop offset=".18" stop-color="#00F5FF" stop-opacity=".52"/><stop offset=".58" stop-color="#8B5CF6" stop-opacity=".16"/><stop offset="1" stop-color="#0B1020" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8290C8" stroke-opacity=".13"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#D8FBFF" stroke-opacity=".045"/></pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="25"/></filter>
</defs>
<rect width="1200" height="390" rx="24" fill="url(#bg)"/>
<rect width="1200" height="390" rx="24" fill="url(#grid)"/>
<rect width="1200" height="390" rx="24" fill="url(#scan)"/>
<ellipse cx="870" cy="190" rx="235" ry="180" fill="#8B5CF6" opacity=".12" filter="url(#soft)"/>
<g fill="none" stroke="url(#neon)" opacity=".4">
