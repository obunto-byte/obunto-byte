name: Refresh 3D profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate animated contribution snake
        uses: Platane/snk@a041d6c27ba561a39f5be9c26a784812765e434b
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=%23ff4b4b&color_dots=%230d1117%2C%23420d0d%2C%237a1111%2C%23c51d1d%2C%23ff5555
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ff4b4b&color_dots=%230d1117%2C%23420d0d%2C%237a1111%2C%23c51d1d%2C%23ff5555

      - name: Commit generated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib dist
          if git diff --cached --quiet; then
            echo "No visual changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh animated profile visuals"
          git push
