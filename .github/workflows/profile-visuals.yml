name: Refresh profile visuals

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Validate profile generator syntax
        run: python -m py_compile scripts/generate_profile_assets.py

      - name: Generate repository-local GitHub panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python scripts/generate_profile_assets.py

      - name: Generate animated contribution snake
        uses: Platane/snk@a041d6c27ba561a39f5be9c26a784812765e434b
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=%2300f5ff&color_dots=%2310182b%2C%233b0764%2C%237e22ce%2C%23db2777%2C%2322d3ee
            dist/github-snake-dark.svg?color_snake=%2300f5ff&color_dots=%2310182b%2C%233b0764%2C%237e22ce%2C%23db2777%2C%2322d3ee

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A generated dist profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No visual changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh local profile visuals"
          git push
